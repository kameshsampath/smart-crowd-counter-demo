version: 2

name: SMART_CROWD_COUNTER
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: KAMESH_DEMOS_S

label: "Smart Crowd Counter"
description:
  "AI-powered conference photo analysis — upload session photos and get attendee counts, raised-hand detection, and
  engagement metrics via Cortex AI."
icon: "public/icon.svg"

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - work
  - scripts
  - "*.plan.md"

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

environment_variables:
  - name: SNOWFLAKE_DATABASE
    value: "CROWD_COUNTER_DB"
  - name: SNOWFLAKE_SCHEMA
    value: "CONFERENCES"
